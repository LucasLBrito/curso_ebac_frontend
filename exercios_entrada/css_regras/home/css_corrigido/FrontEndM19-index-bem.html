<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício boas práticas de CSS - BEM</title>
    <link rel="stylesheet" href="main-bem.css">
</head>
<body>
    <section class="lista-produtos">
        <div class="produto">
            <img class="produto__imagem" src="https://via.placeholder.com/100x100" alt="Smartphone XYZ">
            <h4 class="produto__nome">Smartphone XYZ</h4>
            <p class="produto__descricao">
                Smartphone com câmera de alta resolução
            </p>
            <button class="produto__botao">Comprar</button>
        </div>
        <div class="produto produto--destaque">
            <img class="produto__imagem" src="https://via.placeholder.com/100x100" alt="Notebook ABC">
            <h4 class="produto__nome">Notebook ABC</h4>
            <p class="produto__descricao">
                Notebook com processador de última geração
            </p>
            <button class="produto__botao produto__botao--destaque">Comprar</button>
        </div>
        <div class="produto">
            <img class="produto__imagem" src="https://via.placeholder.com/100x100" alt="Tablet DEF">
            <h4 class="produto__nome">Tablet DEF</h4>
            <p class="produto__descricao">
                Tablet leve e portátil com tela HD
            </p>
            <button class="produto__botao">Comprar</button>
        </div>
    </section>
</body>
</html>
