<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício Gulp - Carrossel Final</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <main class="container">
        <h1>Carrossel Automatizado com Gulp</h1>

        <div class="carrossel">
            <div class="carrossel-inner">
                <div class="carrossel-item ativo">
                    <img src="images/bird-ga5d9ed257_1920.jpg" alt="Imagem 1">
                </div>
                <div class="carrossel-item">
                    <img src="images/birds-g6b63afc7a_1920.jpg" alt="Imagem 2">
                </div>
                <div class="carrossel-item">
                    <img src="images/butterfly-g7f3546b64_1920.jpg" alt="Imagem 3">
                </div>
                <div class="carrossel-item">
                    <img src="images/hands-gc143a78ba_1920.png" alt="Imagem 4">
                </div>
                <div class="carrossel-item">
                    <img src="images/lilies-g19bcb21a4_1920.jpg" alt="Imagem 5">
                </div>
            </div>
            <button class="carrossel-btn btn-prev">&lt;</button>
            <button class="carrossel-btn btn-next">&gt;</button>
        </div>

        <footer id="build-info-container" class="build-info">
            </footer>
    </main>

    <script src="js/main.js"></script>
</body>
</html>
