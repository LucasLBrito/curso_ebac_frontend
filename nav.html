<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar-bootstrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .navbar {
            background-color: #343a40;
        }
        .navbar h1 {
            color: #ffffff;
            margin: 0;
        }
        .nav-link {
            text-align: center;
            color: #ffffff ;
        }
        .nav-link:hover {
            color: #adb5bd !important;
        }
        section{
            height: 100vh;
            padding: 70px;
            
        }
        header{
            position: sticky;
            top: 0;
            left: 0;
        }
        .nav-tabs .nav-link {
            color: #7c7c7c;
           
        }
        .nav-tabs .nav-link.active {
            color: #ffffff;
            background-color: #495057;
        }
    </style>
</head>
<body>
    <header id="menu">
        <div class="navbar navbar-expand-lg ">
           <div class="container">
            <h1>Titulo do site</h1>
            <button type="button" class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <nav class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="nav navbar-nav nav-pills">
                    <li class="nav-item"><a class="nav-link active" href="#Inicio">Início</a></li>
                    <li class="nav-item"><a class="nav-link" href="#Produtos">Produtos</a></li>
                    <li class="nav-item"><a class="nav-link" href="#Promocoes">Promoções</a></li>
                    <li class="nav-item"><a class="nav-link" href="#Contato">Contato</a></li>
                </ul>
            </nav>
            <button id="btn-checar-email" type="button" class="btn btn-warning"> checar caixa de mensagens</button>
           </div>
        </div>
    </header>
   <div data-bs-spy="scroll" data-bs-target="#menu">
    <section id="Inicio">
        <h2>Bem-vindo ao nosso site!</h2>        
        </section>
        <section id="Produtos">
            <h2>Produtos</h2>
            <div class="container">
                <nav class="nav nav-tabs " > 
                    <!-- nav fala que menu configura para funcionar e nav-tabs so estilos de abas -->
                    <button data-bs-toggle="tab" data-bs-target="#eletronicos"  class="nav-link active" type="button">Eletrônicos</button>
                    <button data-bs-toggle="tab" data-bs-target="#moveis"  class="nav-link" type="button">Moveis</button>
                    <button data-bs-toggle="tab" data-bs-target="#roupas"  class="nav-link" type="button">Roupas</button>
                </nav>
                <div class="tab-content">
                    <div class="tab-pane active" id="eletronicos">
                        <h3>Eletrônicos</h3>
                        <p>Explore nossa seleção de eletrônicos.</p>
                    </div>
                    <div class="tab-pane" id="moveis">
                        <h3>Moveis</h3>
                        <p>Descubra nossos móveis elegantes.</p>
                    </div>
                    <div class="tab-pane" id="roupas">
                        <h3>Roupas</h3>
                        <p>Confira nossas roupas da moda.</p>
                    </div>
                </div>
            </div>
        </section>
        <section id="Promocoes">
            <h2>Promoções</h2>
        </section>
        <section id="Contato">
            <h2>Contato</h2>
        </section>
    </div>

    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div data-bs-autohide = "false" class="toast" id="mensagens">
            <header class="toast-header">importante</header>
            <div class="toast-body">
                você tem 10 novas mensagens
                <div class="mt-2 pt-2 border-top">
                    <button class="btn btn-danger" data-bs-dismiss="toast">Descartar</button>
                </div>
            </div>
        </div>
    </div>

    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script>
        const ativadortoast = document.getElementById('btn-checar-email')
        const mensagen = document.getElementById('mensagens');

        if (ativadortoast) {
            ativadortoast.addEventListener('click',function () {
                const toast = new bootstrap.Toast(mensagen)
                toast.show();
            });
        }
    </script>
</body>
</html>
