<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple form in bootscrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container d-flex align-content-center justify-content-center">
    <form class="g-3 row">
        <div class="col-md-12">
            <label for="nome" class="form-label">Seu nome</label>
            <input type="password" class="form-control" id="nome" placeholder="jane doe">
          </div>
        <div class="col-md-12">
          <label for="Email" class="form-label">Seu Email</label>
          <input type="email" class="form-control" id="Email" placeholder="exemplo@email.com"> 
        </div>
        
        <div class="col-md-12">
          <label for="inputAddress" class="form-label">Endereço</label>
          <input type="text" class="form-control" id="inputAddress" placeholder="Rua dos bolos, nº 0">
        </div>
        <div class="col-md-12">
            <label for="inputTel" class="form-label">seu telefone</label>
            <input type="tel" class="form-control" id="inputTel" placeholder="11 99999-9999">
          </div>

        <div class="col-12">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="gridCheck">
            <label class="form-check-label" for="gridCheck">
             li e aceito os termos de uso
            </label>
          </div>
        </div>
        <div class="col-12">
          <button type="submit" class="btn btn-primary">Cadastrar</button>
        </div>
      </form>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
