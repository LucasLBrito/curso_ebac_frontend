<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

</head>
<body>

    <div id="carrousel" class="carousel carousel-fade slide" data-bs-ride="carousel">
        <div class="carousel-inner">
            <div data-bs-interval="1000"class="carousel-item active">
                <img src="https://cdn.pixabay.com/photo/2024/02/22/17/44/rain-8590529_1280.png" class="d-block w-100" alt="...">
            </div>
            <div data-bs-interval="1000" class="carousel-item">
                <img src="https://cdn.pixabay.com/photo/2022/08/17/15/46/labrador-7392840_1280.jpg" class="d-block w-100" alt="...">
            </div>
            <div data-bs-interval="1000" class="carousel-item">
                <img src="https://cdn.pixabay.com/photo/2014/12/10/05/50/english-bulldog-562723_1280.jpg" class="d-block w-100" alt="...">
            </div>
        </div>
        <button data-bs-target="#carrousel" data-bs-slide="prev" class ="carousel-control-prev" type="button">
            <span class="carousel-control-prev-icon"></span>
        </button>
        <button data-bs-target="#carrousel" data-bs-slide="next" class="carousel-control-next" type="button">
            <span class="carousel-control-next-icon"></span>
        </button>
        <div class="carousel-indicators">
            <button data-bs-target="#carrousel" data-bs-slide-to="0" class="active"></button>
            <button data-bs-target="#carrousel" data-bs-slide-to="1"></button>
            <button data-bs-target="#carrousel" data-bs-slide-to="2"></button>
        </div>
    </div>
    



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

</body>
</html>
